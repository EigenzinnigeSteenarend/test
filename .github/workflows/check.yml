name: ASOS voorraadcheck

on:
  schedule:
    - cron: "*/5 * * * *"   # elke 5 minuten (GitHub kan dit vertragen)
  workflow_dispatch:         # handmatig starten via de Actions-tab

concurrency:
  group: asos-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Controleer voorraad
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LOOP_SECONDS: "270"   # ~4,5 minuten blijven controleren, elke 30 sec
          INTERVAL: "30"
        run: python check_stock.py
